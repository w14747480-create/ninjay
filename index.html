<title>فێربوونی ئینگلیزی</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Naskh Arabic",Tahoma,sans-serif;line-height:1.7;display:flex;justify-content:center;padding:12px}
main{width:min(100%,440px)}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:20px;padding:18px;text-align:center;box-shadow:var(--sh);margin-bottom:14px}
.hero h1{margin:0;font-size:1.4rem}.hero p{margin:4px 0 0;opacity:.92;font-size:.95rem}
.pb{height:8px;background:rgba(255,255,255,.3);border-radius:6px;margin-top:10px;overflow:hidden}.pb i{display:block;height:100%;background:#fff;border-radius:6px}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 20px;font-size:1rem;cursor:pointer}
button:active{transform:scale(.97)}
button.ghost{background:var(--card);color:var(--text);border:2px solid var(--line)}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.tile .ic{font-size:1.8rem}.tile b{display:block}.tile small{color:var(--muted)}.tile .st{margin-inline-start:auto;font-size:1.3rem}
.tile.lock{opacity:.5}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card h2{margin:0 0 6px;font-size:1.1rem}.card p{margin:4px 0}
.en{direction:ltr;text-align:left;font-weight:700}
.kd{color:var(--muted);font-size:.95rem}
.center{text-align:center}
.tag{display:inline-block;padding:0 10px;border-radius:99px;color:#fff;font-size:.85rem;margin-inline-start:6px}
.sig{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.sig span{direction:ltr;background:var(--bg);border-radius:8px;padding:0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid button{background:var(--card);color:var(--text);border:2px solid var(--line);padding:12px 0;font-weight:700}
.grid button.done{background:var(--okbg);border-color:var(--ok)}.grid button.lock{opacity:.4}
.words{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.words button{background:var(--bg);color:var(--text);border:2px solid var(--line);padding:8px;text-align:center;line-height:1.4}
.words b{display:block;direction:ltr}.words small{color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.big{font-size:2rem;font-weight:800;direction:ltr;text-align:center;margin:6px 0}
.opts{display:grid;gap:8px;margin-top:12px}
.opts button{background:var(--card);color:var(--text);border:2px solid var(--line);font-size:1.05rem}
.opts button:disabled{opacity:1}.opts .ok{background:var(--okbg);border-color:var(--ok)}.opts .no{background:var(--badbg);border-color:var(--bad)}
.exp{padding:10px 12px;border-radius:12px;margin-bottom:10px}.exp.ok{background:var(--okbg)}.exp.no{background:var(--badbg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin:10px 0;direction:ltr}
.chip{background:var(--bg);color:var(--text);border:2px solid var(--line);padding:6px 12px;font-weight:700}
.inp{width:100%;font:inherit;font-size:1.2rem;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);margin:10px 0;text-align:center}
.timer{font-weight:800;font-size:1.2rem;display:flex;justify-content:space-between;margin-bottom:8px}
.nav{margin-bottom:10px}
/* soft mobile-first theme */
:root{--bg:#f7f5fc;--card:#fffefd;--text:#2b2940;--muted:#7d7a93;--accent:#7d6dd6;--accent2:#f0a58a;--onacc:#fff;--line:#ede9f7;--ok:#4f9d69;--okbg:#e9f6ee;--bad:#d46a6a;--badbg:#fbeeee;--p:#8b7bd8;--n:#6fa8dc;--f:#eda27e;--sh:0 6px 22px rgba(110,95,170,.10)}

html{-webkit-text-size-adjust:100%}
body{padding:14px;min-height:100dvh;font-size:16px;-webkit-tap-highlight-color:transparent}
main{width:min(100%,480px)}
.hero{border-radius:28px;padding:20px 16px;color:var(--onacc);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.hero p{opacity:.95}
.hero .pb{height:10px;border-radius:99px;background:rgba(255,255,255,.35)}
.hero .pb i{background:var(--onacc);border-radius:99px;transition:width .4s}
button{touch-action:manipulation;min-height:48px;border-radius:16px;color:var(--onacc);font-weight:600;transition:transform .12s,background .2s}
button.ghost{color:var(--text)}
.tile,.card{border-width:1.5px;border-radius:22px}
.tile{min-height:68px;padding:12px 16px}
.tile.lock{opacity:.55}
.card{padding:16px}
.bar{height:10px;border-radius:99px}.bar i{border-radius:99px}
.big{font-size:2.1rem}
.opts{gap:10px}
.opts button{min-height:56px;font-size:1.1rem;font-weight:600}
.words{gap:10px}
.words button{min-height:62px;border-radius:16px}
.grid{gap:10px}
.grid button{min-height:52px;border-radius:16px}
.chip{min-height:44px;border-radius:14px}
.chips{border-width:1.5px;border-radius:18px}
.exp{border-radius:18px}
.inp{font-size:1.3rem;min-height:54px;border-radius:16px;border-width:1.5px}
.center button{display:block;width:100%;max-width:340px;margin:6px auto}

</style>

['Last year he ___ a car.','bought',['buy','will buy'],'p','ساڵی ڕابردوو ئەو ئۆتۆمبێلێکی کڕی.'],
['I ___ tea every morning.','drink',['drank','will drink'],'n','هەموو بەیانییەک چا دەخۆمەوە.'],
['Every day she ___ to work.','walks',['walked','will walk'],'n','هەموو ڕۆژێک ئەو بە پێ دەچێت بۆ کار.'],
['He ___ in a big house.','lives',['lived','will live'],'n','ئەو لە خانوویەکی گەورەدا دەژی.'],
['We ___ English every day.','learn',['learned','will learn'],'n','هەموو ڕۆژێک ئینگلیزی فێر دەبین.'],
['Tomorrow I ___ to work.','will go',['went','go'],'f','سبەینێ دەچم بۆ کار.'],
['Next week she ___ a car.','will buy',['bought','buy'],'f','هەفتەی داهاتوو ئەو ئۆتۆمبێلێک دەکڕێت.'],
['Tonight they ___ pizza.','will eat',['ate','eat'],'f','ئەمشەو ئەوان پیتزا دەخۆن.'],
['I ___ you tomorrow.','will call',['called','call'],'f','سبەینێ پەیوەندیت پێوە دەکەم.']];
const RULE={p:'کارەکە تەواو بووە، بۆیە وشەکە ڕابردووە.',n:'ئاسایی یان ڕاستییە، بۆیە وشەی سادە (بۆ he/she/it لەگەڵ s).',f:'کارەکە دواتر دەبێت، بۆیە will + وشەی سادە.'};
const ST=[
{ic:'📚',t:'٥٠٠ وشەی باو',d:'٢٠ بەش، هەر یەکە ٢٥ وشە',go:()=>st1()},
{ic:'⏳',t:'ڕابردوو، ئێستە، داهاتوو',d:'وانە و ١٠ پرسیار',go:()=>st2()},
{ic:'🧩',t:'ڕستە دروستکردن',d:'وشەکان بە ڕیز دابنێ',go:()=>st3()},
{ic:'🎧',t:'گوێگرتن و نووسین',d:'گوێ بگرە و وشەکە بنووسە',go:()=>st4()},
{ic:'⚡',t:'خێرایی ٦٠ چرکە',d:'زۆرترین وەڵامی دروست',go:()=>st5()}];
let P={sets:{},s:{},best:0};
try{P=Object.assign(P,JSON.parse(localStorage.getItem('ew2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ew2',JSON.stringify(P))}catch(e){}};
const $=id=>document.getElementById(id),app=$('app');let TM=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sp=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
const tag=k=>'<span class="tag" style="background:'+TC[k]+'">'+TN[k]+'</span>';
const nav=(f)=>'<div class="nav"><button class="ghost" id="bk">↩ گەڕانەوە</button></div>';
function bindBk(f){const b=$('bk');if(b)b.onclick=f}
function home(){
  clearInterval(TM);
  const n=Object.keys(P.sets).length*25;$('hp').style.width=(n/5)+'%';
  app.innerHTML=ST.map((s,i)=>{const open=i===0||P.s[i];return '<button class="tile'+(open?'':' lock')+'" data-i="'+i+'"><span class="ic">'+s.ic+'</span><span><b>مەرحەلەی '+(i+1)+': '+s.t+'</b><small>'+s.d+'</small></span><span class="st">'+(P.s[i+1]?'✅':open?'▶':'🔒')+'</span></button>'}).join('')+'<p class="center kd">وشە فێربووەکان: '+n+' / 500 — بۆ کردنەوەی مەرحەلەی دواتر دەبێت ٨ لە ١٠ (یان ٦ لە ٨) وەربگریت.</p>';
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===0||P.s[i])ST[i].go()});
}
function run(items,thr,onPass,back,render){
  let i=0,score=0;
  const show=()=>{
    if(i>=items.length)return fin();
    app.innerHTML=nav()+'<div class="bar"><i style="width:'+(i/items.length*100)+'%"></i></div><div class="card" id="body"></div><div id="fbk"></div>';bindBk(back);
    render(items[i],(ok,exp)=>{
      if(ok)score++;
      $('fbk').innerHTML='<div class="exp '+(ok?'ok':'no')+'"><b>'+(ok?'✓ دروستە!':'✗ هەڵەیە')+'</b><br>'+(exp||'')+'</div><div class="center"><button id="nx">دواتر</button></div>';
      $('nx').onclick=()=>{i++;show()};
    });
  };
  const fin=()=>{
    const ok=score>=thr;if(ok)onPass();
    app.innerHTML='<div class="card center"><div class="big">'+score+' / '+items.length+'</div><p>'+(ok?'🎉 مەرحەلەکەت تێپەڕاند!':'پێویستە '+thr+' وەربگریت. دووبارە هەوڵبدەرەوە.')+'</p><button id="re">دووبارە</button> <button class="ghost" id="bb">گەڕانەوە</button></div>';
    $('re').onclick=()=>run(shuffle(items),thr,onPass,back,render);$('bb').onclick=back;
  };
  show();
}
function wordItems(arr){return arr.map(w=>({w:w[0],k:w[1],opts:shuffle([w[1],...shuffle(W).filter(x=>x[1]!==w[1]).slice(0,3).map(x=>x[1])])}))}
function rWord(it,done){
  $('body').innerHTML='<p class="center kd">واتای ئەم وشەیە چییە؟</p><div class="big">'+it.w+' <button class="ghost" id="pl">🔊</button></div><div class="opts" id="o"></div>';
  $('pl').onclick=()=>sp(it.w);sp(it.w);
  it.opts.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{
    document.querySelectorAll('#o button').forEach(x=>{x.disabled=true;if(x.textContent===it.k)x.classList.add('ok')});
    if(o!==it.k)b.classList.add('no');done(o===it.k,'<span class="en">'+it.w+'</span> = '+it.k)};$('o').appendChild(b)});
}
function st1(){
  app.innerHTML=nav()+'<div class="card"><h2>٥٠٠ وشەی باو</h2><p class="kd">هەر بەشێک ٢٥ وشەیە. وشەکان بخوێنەرەوە، پاشان تاقیکردنەوە (١٠ پرسیار) بکە و ٨ وەربگرە.</p></div><div class="grid" id="g"></div>';bindBk(home);
  for(let n=1;n<=20;n++){const open=n===1||P.sets[n-1],b=document.createElement('button');b.textContent=P.sets[n]?'✓ '+n:open?n:'🔒';b.className=P.sets[n]?'done':open?'':'lock';b.onclick=()=>{if(open)setView(n)};$('g').appendChild(b)}
}
function setView(n){
  const arr=W.slice((n-1)*25,n*25);
  app.innerHTML=nav()+'<div class="card"><h2>بەشی '+n+'</h2><p class="kd">لەسەر هەر وشەیەک بدە بۆ گوێگرتن.</p></div><div class="words">'+arr.map((w,i)=>'<button data-i="'+i+'"><b>'+w[0]+'</b><small>'+w[1]+'</small></button>').join('')+'</div><div class="center" style="margin-top:12px"><button id="go">تاقیکردنەوە</button></div>';
  bindBk(st1);app.querySelectorAll('.words button').forEach(b=>b.onclick=()=>sp(arr[b.dataset.i][0]));
  $('go').onclick=()=>run(wordItems(shuffle(arr).slice(0,10)),8,()=>{P.sets[n]=1;if(Object.keys(P.sets).length>=4)P.s[1]=1;save()},()=>setView(n),rWord);
}
function st2(){
  app.innerHTML=nav()+LES.map(l=>'<div class="card"><h2>'+l[1]+tag(l[0])+'</h2><p>'+l[2]+'</p><div class="sig">'+l[3].map(s=>'<span>'+s+'</span>').join('')+'</div><p><b>شێواز:</b> '+l[4]+'</p><p class="en">'+l[5]+'</p><p class="kd">'+l[6]+'</p></div>').join('')+'<div class="center"><button id="go">دەستپێبکە</button></div>';
  bindBk(home);
  $('go').onclick=()=>run(shuffle(Q).slice(0,10).map(q=>({q,t:Math.random()<.6?'A':'B'})),8,()=>{P.s[2]=1;save()},st2,rTense);
}
function rTense(it,done){
  const q=it.q,full=q[0].replace('___',q[1]),A=it.t==='A',opts=A?shuffle([q[1],...q[2]]):['p','n','f'],right=A?q[1]:q[3];
  $('body').innerHTML='<p class="center kd">'+(A?'وشە دروستەکە هەڵبژێرە':'ئەم ڕستەیە کامە کاتە؟')+'</p><div class="big" style="font-size:1.4rem">'+(A?q[0]:full)+'</div><p class="center kd">'+q[4]+'</p><div class="opts" id="o"></div>';
  opts.forEach(o=>{const b=document.createElement('button');b.textContent=A?o:TN[o];b.dataset.v=o;b.onclick=()=>{
    document.querySelectorAll('#o button').forEach(x=>{x.disabled=true;if(x.dataset.v===right)x.classList.add('ok')});
    if(o!==right)b.classList.add('no');
    const m=full.match(/yesterday|last \w+|every \w+|tomorrow|next \w+|tonight/i);
    done(o===right,'<span class="en">'+full+'</span>'+(m?'نیشانەی کات: <b>'+m[0]+'</b>. ':'')+'کاتەکەی: '+tag(q[3])+'<br>'+RULE[q[3]])};$('o').appendChild(b)});
}
function st3(){
  run(shuffle(Q).slice(0,8),6,()=>{P.s[3]=1;save()},home,(q,done)=>{
    const full=q[0].replace('___',q[1]);let pool=shuffle(full.split(' ').map((w,i)=>({w,i}))),ans=[],fin=false;
    const draw=()=>{
      $('body').innerHTML='<p class="center kd">'+q[4]+'</p><div class="chips" id="an">'+(ans.map(c=>'<button class="chip" data-i="'+c.i+'">'+c.w+'</button>').join('')||'<span class="kd">وشەکان لێرە دابنێ</span>')+'</div><div class="chips" id="pl">'+pool.map(c=>'<button class="chip" data-i="'+c.i+'">'+c.w+'</button>').join('')+'</div><div class="center"><button id="ck">پشکنین</button></div>';
      if(fin)return;
      $('pl').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=pool.findIndex(c=>c.i==b.dataset.i);ans.push(pool.splice(k,1)[0]);draw()});
      $('an').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=ans.findIndex(c=>c.i==b.dataset.i);pool.push(ans.splice(k,1)[0]);draw()});
      $('ck').onclick=()=>{fin=true;const ok=ans.map(c=>c.w).join(' ')===full;draw();$('ck').disabled=true;done(ok,'<span class="en">'+full+'</span>')};
    };draw();
  });
}
function st4(){
  const pool=W.filter(w=>w[0].length>=4);
  run(shuffle(pool).slice(0,8).map(w=>({w:w[0],k:w[1]})),6,()=>{P.s[4]=1;save()},home,(it,done)=>{
    $('body').innerHTML='<p class="center kd">مانا: <b>'+it.k+'</b></p><div class="center"><button id="pl">🔊 گوێ بگرە</button></div><input class="inp" id="in" dir="ltr" autocomplete="off" autocapitalize="off" placeholder="..."><div class="center"><button id="ck">پشکنین</button></div>';
    $('pl').onclick=()=>sp(it.w);sp(it.w);
    const chk=()=>{const ok=$('in').value.trim().toLowerCase()===it.w.toLowerCase();$('ck').disabled=true;$('in').disabled=true;done(ok,'<span class="en">'+it.w+'</span> = '+it.k)};
    $('ck').onclick=chk;$('in').onkeydown=e=>{if(e.key==='Enter'&&!$('ck').disabled)chk()};
  });
}
function st5(){
  let t=60,sc=0;
  app.innerHTML=nav()+'<div class="timer"><span>⏱ <b id="tm">60</b></span><span>✓ <b id="sc">0</b></span></div><div class="card" id="body"></div>';bindBk(home);
  const q=()=>{const it=wordItems([W[Math.floor(Math.random()*W.length)]])[0];
    $('body').innerHTML='<div class="big">'+it.w+'</div><div class="opts" id="o"></div>';
    it.opts.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(o===it.k){sc++;$('sc').textContent=sc;}else{t=Math.max(0,t-3);}q()};$('o').appendChild(b)})};
  q();
  TM=setInterval(()=>{t--;$('tm').textContent=Math.max(t,0);if(t<=0){clearInterval(TM);
    if(sc>P.best)P.best=sc;if(sc>=12)P.s[5]=1;save();
    app.innerHTML='<div class="card center"><div class="big">'+sc+'</div><p>'+(sc>=12?'🏆 نایابە!':'١٢ وەڵامی دروست پێویستە.')+'</p><p class="kd">باشترین: '+P.best+'</p><button id="re">دووبارە</button> <button class="ghost" id="bb">گەڕانەوە</button></div>';
    $('re').onclick=st5;$('bb').onclick=home;}},1000);
}
home();
</script>
</body>
</html>
